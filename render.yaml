# Render Blueprint configuration for Kwara L-PRES Website & Marketplace
services:
  # 1. Backend API (Python FastAPI Web Service)
  - type: web
    name: lpres-website-backend
    runtime: python
    region: us-east
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: S3_BUCKET_NAME
        value: lpres-intelligence-docs-dev
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SEED_PASSWORD
        sync: false

  # 2. Frontend Application (React Vite Static Site)
  - type: static
    name: lpres-website-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # 3. Standalone Marketplace Frontend (React Vite Static Site)
  - type: static
    name: lpres-marketplace
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_MODE
        value: marketplace


